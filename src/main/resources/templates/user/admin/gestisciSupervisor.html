<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestisci Supervisor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/style.css"/>
    <link rel="stylesheet" href="/css/navbar.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container my-5" style="max-width:600px;">
    <h2 class="mb-4">Gestisci Supervisor — <span th:text="${tratta.nome}"></span></h2>

    <!-- Supervisor attuale -->
    <div class="card mb-4 p-3 shadow-sm">
        <h5>Supervisor attuale</h5>
        <div th:if="${tratta.supervisor != null}">
            <p><strong th:text="${tratta.supervisor.name + ' ' + tratta.supervisor.surname}"></strong></p>
            <p class="text-muted" th:text="${tratta.supervisor.email}"></p>
            <form th:action="@{'/admin/tratta/' + ${tratta.id} + '/rimuoviSupervisor'}" method="post">
                <button class="btn btn-danger btn-sm">Rimuovi Supervisor</button>
            </form>
        </div>
        <p th:if="${tratta.supervisor == null}" class="text-muted">Nessun supervisor assegnato.</p>
    </div>

    <!-- Assegna nuovo supervisor -->
    <div class="card p-3 shadow-sm">
        <h5>Assegna nuovo Supervisor</h5>
        <form th:action="@{'/admin/tratta/' + ${tratta.id} + '/assegnaSupervisor'}" method="post">
            <div class="mb-3">
                <label class="form-label">Seleziona utente</label>
                <select name="userId" class="form-select">
                    <option th:each="u : ${utenti}"
                            th:value="${u.id}"
                            th:text="${u.name + ' ' + u.surname + ' (' + u.email + ')'}"></option>
                </select>
            </div>
            <button class="btn btn-primary">Assegna</button>
        </form>
    </div>

    <a th:href="@{'/tratta/' + ${tratta.id}}" class="btn btn-secondary mt-3">← Torna alla tratta</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
