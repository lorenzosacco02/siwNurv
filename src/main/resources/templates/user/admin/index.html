<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/adminIndex.css" />
    <link rel="stylesheet" href="/css/navbarDark.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container main-wrapper">
    <div class="row justify-content-center align-items-stretch g-5 w-100">
        <div class="col-md-5 d-flex">
            <div class="login-box flex-fill">
                <img src="/images/Video.png" alt="Aggiungi Video" class="box-image">
                <h2 class="title">Aggiungi Video</h2>
                <p class="subtitle">Aggiungi video di una tratta</p>
                <a href="/admin/addVideo" class="btn btn-navy mt-auto">Video</a>
            </div>
        </div>

        <div class="col-md-5 d-flex">
            <div class="login-box flex-fill">
                <img src="/images/Tratta.png" alt="Vedi le tratte" class="box-image">
                <h2 class="title">Vedi le tratte</h2>
                <p class="subtitle">Esplora le tratte e verifica le anomalie</p>
                <a href="/tratte" class="btn btn-navy mt-auto">Tratte</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
